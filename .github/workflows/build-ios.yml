name: Build iOS IPA with Fastlane

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install Expo CLI globally
      run: npm install -g @expo/cli
    
    - name: Fix permissions
      run: chmod +x node_modules/.bin/expo || true
    
    - name: Prebuild iOS project
      run: npx --yes @expo/cli prebuild --platform ios --clean
    
    - name: Fix Podfile for compatibility
      run: |
        cd ios
        sed -i.bak '/:privacy_file_aggregation_enabled/d' Podfile || true
    
    - name: Update CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
    
    - name: Install CocoaPods dependencies
      run: |
        cd ios
        pod install --repo-update
    
    - name: Install Fastlane
      run: |
        sudo gem install fastlane
    
    - name: Build with Fastlane (no signing)
      run: |
        cd ios
        
        # Create Fastfile
        mkdir -p fastlane
        cat > fastlane/Fastfile << 'EOF'
        default_platform(:ios)

        platform :ios do
          desc "Build unsigned IPA"
          lane :build_unsigned do
            build_app(
              workspace: Dir.glob("*.xcworkspace").first,
              scheme: "LandscapeVideoApp",
              configuration: "Release",
              export_method: "development",
              skip_profile_detection: true,
              codesigning_identity: "",
              export_options: {
                signingStyle: "manual",
                compileBitcode: false
              },
              skip_codesigning: true,
              output_directory: "./build",
              output_name: "LandscapeVideoApp.ipa"
            )
          end
        end
        EOF
        
        # Try to build
        fastlane build_unsigned || echo "Fastlane build failed, trying manual method"
    
    - name: Manual IPA creation (fallback)
      if: always()
      run: |
        cd ios
        
        # Find workspace
        WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
        
        # Build the app
        xcodebuild -workspace "$WORKSPACE" \
          -scheme LandscapeVideoApp \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath ./build \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO || true
        
        # Find the .app
        APP_PATH=$(find build -name "*.app" -type d -not -path "*/Pods/*" | head -n 1)
        
        if [ -n "$APP_PATH" ]; then
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r LandscapeVideoApp.ipa Payload
          mv LandscapeVideoApp.ipa build/ || true
        fi
    
    - name: Verify IPA exists
      run: |
        cd ios
        if [ -f build/LandscapeVideoApp.ipa ]; then
          echo "✅ IPA created successfully!"
          ls -lh build/LandscapeVideoApp.ipa
        else
          echo "❌ IPA not found, creating from scratch..."
          
          # Last resort: find any .app and package it
          APP=$(find . -name "*.app" -type d -not -path "*/Pods/*" -not -path "*/*Frameworks/*" | head -n 1)
          
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r build/LandscapeVideoApp.ipa Payload
            echo "✅ Created IPA from: $APP"
            ls -lh build/LandscapeVideoApp.ipa
          else
            echo "❌ No .app bundle found anywhere"
            exit 1
          fi
        fi
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: LandscapeVideoApp-IPA
        path: ios/build/LandscapeVideoApp.ipa
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### ✅ Build completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the IPA from Artifacts above." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Install with Sideloadly:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download Sideloadly: https://sideloadly.io/" >> $GITHUB_STEP_SUMMARY
        echo "2. Drag IPA into Sideloadly" >> $GITHUB_STEP_SUMMARY
        echo "3. Sign with your Apple ID" >> $GITHUB_STEP_SUMMARY
        echo "4. Install on iPhone!" >> $GITHUB_STEP_SUMMARY
