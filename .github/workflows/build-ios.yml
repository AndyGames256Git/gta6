name: Build iOS IPA (No Signing Required)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install Expo CLI globally
      run: npm install -g @expo/cli
    
    - name: Fix permissions
      run: chmod +x node_modules/.bin/expo || true
    
    - name: Prebuild iOS project
      run: npx --yes @expo/cli prebuild --platform ios --clean
    
    - name: Fix Podfile for compatibility
      run: |
        cd ios
        sed -i.bak '/:privacy_file_aggregation_enabled/d' Podfile || true
    
    - name: Update CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
    
    - name: Install CocoaPods dependencies
      run: |
        cd ios
        pod install --repo-update
    
    - name: List iOS contents
      run: |
        cd ios
        echo "=== Workspace/Project files ==="
        ls -la *.xcworkspace *.xcodeproj 2>/dev/null || echo "None found"
    
    - name: Build app without code signing
      run: |
        cd ios
        
        # Find the workspace
        WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
        
        if [ -z "$WORKSPACE" ]; then
          echo "❌ No workspace found"
          exit 1
        fi
        
        echo "Using workspace: $WORKSPACE"
        
        # Build for device without signing
        xcodebuild -workspace "$WORKSPACE" \
          -scheme GTAVI \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath ./build \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO
        
        echo "✅ Build completed"
    
    - name: Find and package .app into IPA
      run: |
        cd ios
        
        echo "=== Searching for .app bundle ==="
        find build -name "*.app" -type d -not -path "*/Pods/*"
        
        # Find the .app bundle
        APP_PATH=$(find build -name "*.app" -type d -not -path "*/Pods/*" -not -path "*/PlugIns/*" | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "❌ No .app bundle found"
          echo "=== Build directory structure ==="
          ls -R build
          exit 1
        fi
        
        echo "✅ Found app at: $APP_PATH"
        
        # Create Payload directory
        mkdir -p Payload
        
        # Copy .app to Payload
        cp -r "$APP_PATH" Payload/
        
        # Verify the copy
        ls -la Payload/
        
        # Create IPA (just a ZIP file)
        zip -r GTAVI.ipa Payload
        
        # Move to build folder
        mkdir -p build
        mv GTAVI.ipa build/
        
        echo "✅ IPA created successfully!"
        ls -lh build/GTAVI.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: GTAVI-IPA
        path: ios/build/GTAVI.ipa
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### ✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the IPA from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To install on your iPhone:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download Sideloadly: https://sideloadly.io/" >> $GITHUB_STEP_SUMMARY
        echo "2. Install Sideloadly on Windows" >> $GITHUB_STEP_SUMMARY
        echo "3. Download the IPA artifact from this workflow" >> $GITHUB_STEP_SUMMARY
        echo "4. Drag the IPA into Sideloadly" >> $GITHUB_STEP_SUMMARY
        echo "5. Connect your iPhone via USB" >> $GITHUB_STEP_SUMMARY
        echo "6. Enter your FREE Apple ID in Sideloadly" >> $GITHUB_STEP_SUMMARY
        echo "7. Click Start - Sideloadly will sign and install!" >> $GITHUB_STEP_SUMMARY
