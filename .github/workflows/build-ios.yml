name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install Expo CLI globally
      run: npm install -g @expo/cli
    
    - name: Fix permissions
      run: chmod +x node_modules/.bin/expo || true
    
    - name: Prebuild iOS project
      run: npx --yes @expo/cli prebuild --platform ios --clean
    
    - name: Fix Podfile for compatibility
      run: |
        cd ios
        # Remove the privacy_file_aggregation_enabled line if it exists
        sed -i.bak '/:privacy_file_aggregation_enabled/d' Podfile
        cat Podfile
    
    - name: Update CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
    
    - name: Install CocoaPods dependencies
      run: |
        cd ios
        pod install --repo-update
    
    - name: Debug - List iOS directory contents
      run: |
        cd ios
        echo "=== iOS directory contents ==="
        ls -la
        echo "=== Looking for workspace/project files ==="
        find . -name "*.xcworkspace" -o -name "*.xcodeproj"
    
    - name: Build unsigned archive
      run: |
        cd ios
        
        # Find the workspace or project file
        if [ -f *.xcworkspace/contents.xcworkspacedata ]; then
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          echo "Found workspace: $WORKSPACE"
          BUILD_TARGET="-workspace $WORKSPACE"
        elif [ -f *.xcodeproj/project.pbxproj ]; then
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          echo "Found project: $PROJECT"
          BUILD_TARGET="-project $PROJECT"
        else
          echo "Error: No workspace or project found"
          ls -la
          exit 1
        fi
        
        # Find the scheme name
        SCHEME=$(xcodebuild -list $BUILD_TARGET | grep -A 1 "Schemes:" | tail -n 1 | xargs)
        echo "Using scheme: $SCHEME"
        
        xcodebuild $BUILD_TARGET \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath $PWD/build/LandscapeVideoApp.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
    
    - name: Create unsigned IPA
      run: |
        cd ios
        
        # Find the .app bundle
        APP_PATH=$(find build/LandscapeVideoApp.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app bundle not found"
          exit 1
        fi
        
        echo "Found app at: $APP_PATH"
        
        # Create Payload directory
        mkdir -p build/Payload
        
        # Copy .app to Payload
        cp -r "$APP_PATH" build/Payload/
        
        # Create IPA (just a ZIP file with .ipa extension)
        cd build
        zip -r LandscapeVideoApp-unsigned.ipa Payload
        
        echo "✅ Unsigned IPA created successfully"
        ls -lh LandscapeVideoApp-unsigned.ipa
    
    - name: Upload unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: LandscapeVideoApp-unsigned
        path: ios/build/LandscapeVideoApp-unsigned.ipa
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### ✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the unsigned IPA from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download Sideloadly: https://sideloadly.io/" >> $GITHUB_STEP_SUMMARY
        echo "2. Install Sideloadly on Windows" >> $GITHUB_STEP_SUMMARY
        echo "3. Drag the unsigned IPA into Sideloadly" >> $GITHUB_STEP_SUMMARY
        echo "4. Sign with your FREE Apple ID" >> $GITHUB_STEP_SUMMARY
        echo "5. Install on your iPhone!" >> $GITHUB_STEP_SUMMARY
